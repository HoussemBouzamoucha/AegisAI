[package]
name = "antivirus_engine"
version = "1.0.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Multi-layer malware detection engine with dynamic behavioral analysis"
license = "MIT"

[dependencies]
anyhow    = "1.0"
hex       = "0.4"
walkdir   = "2.5"
sha2      = "0.10.9"
md5       = "0.8.0"
sysinfo   = "0.38.4"

serde      = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
yara-x     = "1.13.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Wdk_Foundation",
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["json"]
json    = ["dep:serde", "dep:serde_json"]
full    = ["json"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "antivirus"
path = "src/main.rs"