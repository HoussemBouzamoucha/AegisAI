[package]
name = "antivirus_engine"
version = "0.1.0"
edition = "2021"
authors = ["AegisAI Team <team@aegisai.com>"]
description = "AegisAI Rust-based antivirus engine"
license = "MIT"
repository = "https://github.com/yourusername/AegisAI"

[dependencies]
# Core utilities
anyhow = "1.0"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
entropy = "0.1"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Serde for optional JSON support
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["json"]        # Enable JSON support by default
json = ["serde", "serde_json"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
